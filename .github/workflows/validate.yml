name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  examples:
    name: FHIR examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: .fhir-cache
          key: fhir-${{ hashFiles('fhir-packages.json', 'vendor/rnds/manifest.json') }}
      - run: sh scripts/validate-examples.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: validation.json
          if-no-files-found: ignore

  site:
    name: Site build and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
